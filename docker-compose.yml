services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().myState } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); 0 }\" | grep -qx 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: ${DB_NAME:-snp_camps_local}
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-change-before-production}
      AADHAAR_HASH_PEPPER: ${AADHAAR_HASH_PEPPER:-local-docker-aadhaar-pepper-change-before-production}
      ADMIN_BOOTSTRAP_PIN: ${ADMIN_BOOTSTRAP_PIN:-864200}
      CRON_SECRET: ${CRON_SECRET:-local-docker-reminder-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
