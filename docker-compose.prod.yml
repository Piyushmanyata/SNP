services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:?set DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AADHAAR_HASH_PEPPER: ${AADHAAR_HASH_PEPPER:?set AADHAAR_HASH_PEPPER}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?set MSG91_AUTH_KEY}
      MSG91_TEMPLATE_REGISTRATION: ${MSG91_TEMPLATE_REGISTRATION:?set MSG91_TEMPLATE_REGISTRATION}
      MSG91_TEMPLATE_CAMP: ${MSG91_TEMPLATE_CAMP:?set MSG91_TEMPLATE_CAMP}
      MSG91_TEMPLATE_OT_TOKEN: ${MSG91_TEMPLATE_OT_TOKEN:?set MSG91_TEMPLATE_OT_TOKEN}
      MSG91_TEMPLATE_OT: ${MSG91_TEMPLATE_OT:?set MSG91_TEMPLATE_OT}
      MSG91_TEMPLATE_SPECS_TOKEN: ${MSG91_TEMPLATE_SPECS_TOKEN:?set MSG91_TEMPLATE_SPECS_TOKEN}
      MSG91_TEMPLATE_SPECS: ${MSG91_TEMPLATE_SPECS:?set MSG91_TEMPLATE_SPECS}
    depends_on:
      mongo:
        condition: service_healthy
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_BACKEND_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
