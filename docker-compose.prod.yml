x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/usr/local/bin/snp-mongo-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: snp
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD to a random hex value}
      DB_NAME: ${DB_NAME:?set DB_NAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD to a random hex value}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?set MONGO_BACKUP_PASSWORD to a random hex value}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./ops/mongo/entrypoint.sh:/usr/local/bin/snp-mongo-entrypoint.sh:ro
      - ./ops/mongo/init-users.js:/docker-entrypoint-initdb.d/init-users.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().myState } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); 0 }\" | grep -qx 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_URL: mongodb://snp_app:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?replicaSet=rs0&authSource=${DB_NAME}
      DB_NAME: ${DB_NAME:?set DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AADHAAR_HASH_PEPPER: ${AADHAAR_HASH_PEPPER:?set AADHAAR_HASH_PEPPER}
      ADMIN_BOOTSTRAP_PIN: ${ADMIN_BOOTSTRAP_PIN:?set ADMIN_BOOTSTRAP_PIN}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_REGISTRATION: ${MSG91_TEMPLATE_REGISTRATION:-}
      MSG91_TEMPLATE_CAMP: ${MSG91_TEMPLATE_CAMP:-}
      MSG91_TEMPLATE_OT_TOKEN: ${MSG91_TEMPLATE_OT_TOKEN:-}
      MSG91_TEMPLATE_OT: ${MSG91_TEMPLATE_OT:-}
      MSG91_TEMPLATE_SPECS_TOKEN: ${MSG91_TEMPLATE_SPECS_TOKEN:-}
      MSG91_TEMPLATE_SPECS: ${MSG91_TEMPLATE_SPECS:-}
      MSG91_TEMPLATE_OT_CHANGE: ${MSG91_TEMPLATE_OT_CHANGE:-}
      MSG91_TEMPLATE_SPECS_CHANGE: ${MSG91_TEMPLATE_SPECS_CHANGE:-}
      MSG91_WEBHOOK_SECRET: ${MSG91_WEBHOOK_SECRET:-}
    volumes:
      - backups:/backups:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  reminders:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: python reminder_worker.py
    stop_grace_period: 130s
    depends_on:
      backend:
        condition: service_healthy

  backup:
    build: ./ops/backup
    restart: unless-stopped
    logging: *logging
    environment:
      DB_NAME: ${DB_NAME}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD to a long random value and keep a copy off the VPS}
      RESTIC_REMOTE_REPOSITORY: ${RESTIC_REMOTE_REPOSITORY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  mongo_config:
  caddy_data:
  caddy_config:
  backups:
