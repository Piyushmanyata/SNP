x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: snp
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD to a random hex value}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_URL: mongodb://snp:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:?set DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AADHAAR_HASH_PEPPER: ${AADHAAR_HASH_PEPPER:?set AADHAAR_HASH_PEPPER}
      ADMIN_BOOTSTRAP_PIN: ${ADMIN_BOOTSTRAP_PIN:?set ADMIN_BOOTSTRAP_PIN}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_REGISTRATION: ${MSG91_TEMPLATE_REGISTRATION:-}
      MSG91_TEMPLATE_CAMP: ${MSG91_TEMPLATE_CAMP:-}
      MSG91_TEMPLATE_OT_TOKEN: ${MSG91_TEMPLATE_OT_TOKEN:-}
      MSG91_TEMPLATE_OT: ${MSG91_TEMPLATE_OT:-}
      MSG91_TEMPLATE_SPECS_TOKEN: ${MSG91_TEMPLATE_SPECS_TOKEN:-}
      MSG91_TEMPLATE_SPECS: ${MSG91_TEMPLATE_SPECS:-}
      MSG91_WEBHOOK_SECRET: ${MSG91_WEBHOOK_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  reminders:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: python reminder_worker.py
    stop_grace_period: 130s
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    environment:
      DB_NAME: ${DB_NAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
    command: sh /backup.sh
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  backups:
