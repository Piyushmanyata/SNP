name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest flake8 requests

      - name: Verify Backend Python Syntax & Imports
        run: |
          python -m py_compile backend/*.py
          python -c "import sys; sys.path.insert(0, 'backend'); import server, db, models, security, helpers, serializers, aadhaar, routes_auth, routes_staff, routes_camps, routes_registration, routes_desk, routes_clinical, routes_reports, routes_templates; print('Backend modules verified')"
          pytest backend/tests/test_aadhaar_unit.py backend/tests/test_seed_admin.py backend/tests/test_cors.py backend/tests/test_indexes.py backend/tests/test_adversarial_challenger.py backend/tests/test_reminders.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
