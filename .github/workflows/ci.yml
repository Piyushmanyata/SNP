name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNP_LIVE_API: http://127.0.0.1:3000
      SNP_TEST_ADMIN_NAME: admin
      SNP_TEST_ADMIN_PIN: "8642"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: |
          pip install -r backend/requirements-dev.txt pip-audit
          npm ci --prefix frontend
      - name: Python syntax and lint
        run: |
          python -m compileall -q backend
          python -m flake8 --select=F,E9 backend
      - name: Frontend lint and full test suite
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --runInBand
          npm run build
      - name: Dependency audits
        run: |
          pip-audit -r backend/requirements.txt
          npm audit --prefix frontend
      - name: Start isolated production images
        run: docker compose --env-file .env.example -p snp-ci up -d --build --wait
      - name: Full backend suite including real HTTP and MongoDB workflows
        run: python -m pytest backend/tests -q
      - name: Container status on failure
        if: failure()
        run: docker compose --env-file .env.example -p snp-ci logs --tail=80
      - name: Remove isolated test services
        if: always()
        run: docker compose --env-file .env.example -p snp-ci down -v
