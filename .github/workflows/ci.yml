name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --runInBand --ci --coverage --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary --json --outputFile=test-results.json
      - run: npm run check-tests
      - run: npm run build
      - run: npm run check-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend/test-results.json
            frontend/coverage/
          retention-days: 14

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SNP_LIVE_API: http://127.0.0.1:3000
      SNP_TEST_ADMIN_NAME: admin
      SNP_TEST_ADMIN_PIN: "864200"
      SNP_REQUIRE_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m mypy --config-file backend/mypy.ini
      - run: python -m compileall -q backend
      - run: python -m flake8 --select=F,E9 backend
      - name: Validate production configuration
        env:
          APP_DOMAIN: ci.example.com
          TLS_EMAIL: ci@example.com
          MONGO_PASSWORD: ci-mongo-password
          MONGO_APP_PASSWORD: ci-mongo-app-password
          MONGO_BACKUP_PASSWORD: ci-mongo-backup-password
          DB_NAME: snp_ci
          JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
          AADHAAR_HASH_PEPPER: ci-aadhaar-pepper
          ADMIN_BOOTSTRAP_PIN: "864200"
          CRON_SECRET: ci-reminder-secret
          RESTIC_PASSWORD: ci-restic-password
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          shellcheck -e SC2016 ops/backup/*.sh ops/mongo/entrypoint.sh
          docker build -q -t snp-backup ops/backup
          docker run --rm snp-backup restic version
          docker run --rm -e APP_DOMAIN -e TLS_EMAIL -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start isolated production images
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-ci up -d --build --wait --wait-timeout 180
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-ci exec -T frontend nginx -t
      - name: Full backend suite with real HTTP and MongoDB
        run: python -m pytest backend/tests -q --deselect backend/tests/test_benchmark_http.py::test_seeded_camp_meets_the_p95_budgets --strict-markers --strict-config --junitxml=backend/test-results.xml --cov=backend --cov-config=backend/.coveragerc --cov-fail-under=88 --cov-report=xml:backend/coverage.xml --cov-report=term:skip-covered
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-ci logs --no-color --tail=100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-reports
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 14
      - name: Remove isolated services
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-ci down -v

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip_audit -r backend/requirements-dev.txt
      - run: npm audit --prefix frontend --audit-level=low

  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker run --rm --network none -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - run: git diff --check

  prod-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_DOMAIN: localhost
      TLS_EMAIL: ci@example.com
      MONGO_PASSWORD: ci-mongo-password
      MONGO_APP_PASSWORD: ci-mongo-app-password
      MONGO_BACKUP_PASSWORD: ci-mongo-backup-password
      DB_NAME: snp_ci
      JWT_SECRET: ci-jwt-secret-of-at-least-32-bytes
      AADHAAR_HASH_PEPPER: ci-aadhaar-pepper
      ADMIN_BOOTSTRAP_PIN: "864200"
      CRON_SECRET: ci-cron-secret
      RESTIC_PASSWORD: ci-restic-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Boot the production stack on localhost
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke up -d --build --wait --wait-timeout 300
      - name: Ready, home page, CSP and HSTS
        run: |
          set -euo pipefail
          body=$(curl -skf https://localhost/api/health/ready)
          printf '%s\n' "$body" | grep -q '"ready":true'
          body2=$(curl -skf https://localhost/api/health/ready)
          printf '%s\n' "$body2" | grep -q '"ready":true'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = "200"
          headers=$(curl -skI https://localhost/)
          printf '%s\n' "$headers" | grep -qi "content-security-policy: default-src 'self'"
          printf '%s\n' "$headers" | grep -qi "strict-transport-security:"
      - name: The app user cannot list every database
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke exec -T mongo \
            mongosh --quiet "mongodb://snp_app:${MONGO_APP_PASSWORD}@127.0.0.1:27017/${DB_NAME}?authSource=${DB_NAME}&replicaSet=rs0" \
            --eval 'try { const r = db.adminCommand({listDatabases:1, authorizedDatabases:false}); if (r.ok) quit(1); } catch (e) { if (!/not authorized|Unauthorized|Insufficient permissions/i.test(String(e))) quit(1); }'
      - name: Backup under writes, then the isolated restore drill
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke exec -T backup restic snapshots --tag snp --json | grep -q '"short_id"'; then
              break
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke exec -T backup restore-drill.sh | tee drill.txt
          grep -q "DRILL OK" drill.txt
      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: prod-smoke-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Remove the smoke stack
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-prod-smoke down -v

  e2e:
    needs: prod-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_DOMAIN: localhost
      TLS_EMAIL: ci@example.com
      MONGO_PASSWORD: ci-mongo-password
      MONGO_APP_PASSWORD: ci-mongo-app-password
      MONGO_BACKUP_PASSWORD: ci-mongo-backup-password
      DB_NAME: snp_ci
      JWT_SECRET: ci-jwt-secret-of-at-least-32-bytes
      AADHAAR_HASH_PEPPER: ci-aadhaar-pepper
      ADMIN_BOOTSTRAP_PIN: "864200"
      CRON_SECRET: ci-cron-secret
      RESTIC_PASSWORD: ci-restic-password
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Card fixtures need the QR writer
        working-directory: .
        run: python -m pip install -r backend/requirements.txt
      - name: Boot the production stack on localhost
        working-directory: .
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-e2e up -d --build --wait --wait-timeout 300
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Compose logs
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-e2e logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: e2e-logs
          path: |
            compose-logs.txt
            frontend/test-results/
          retention-days: 7
      - name: Remove the e2e stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ci.yml -p snp-e2e down -v

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run when backend changed, or on the nightly schedule
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${{ github.base_ref }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git fetch --depth=1 origin "${{ github.base_ref }}" && git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -q '^backend/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Mongo replica for the benchmark
        if: steps.gate.outputs.run == 'true'
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-perf up -d --wait --wait-timeout 180 mongo
      - name: p95 budgets
        if: steps.gate.outputs.run == 'true'
        env:
          SNP_PERF: "1"
          SNP_BENCHMARK_JSON: benchmark.json
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
          AADHAAR_HASH_PEPPER: ci-aadhaar-pepper
          JWT_SECRET: ci-jwt-secret-of-at-least-32-bytes
          ADMIN_BOOTSTRAP_PIN: "864200"
        run: python -m pytest backend/tests/test_benchmark_http.py::test_seeded_camp_meets_the_p95_budgets -q --tb=short --strict-markers --strict-config
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark
          path: benchmark.json
          retention-days: 14
      - name: Compose logs
        if: failure() && steps.gate.outputs.run == 'true'
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-perf logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: perf-logs
          path: compose-logs.txt
          retention-days: 7
      - if: always() && steps.gate.outputs.run == 'true'
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.ci.yml -p snp-perf down -v

  verify:
    if: always()
    needs: [frontend, backend, dependencies, workflow, prod-smoke, e2e, perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = success,success,success,success,success,success,success
